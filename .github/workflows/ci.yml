name: CI / Automated Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-supabase-anon-key"
          GROQ_API_KEY: "gsk_ci_test_key_for_mocking"
          GEMINI_API_KEY: "AIzaSy_ci_test_key_for_mocking"
          FRONTEND_URL: "http://localhost:5173"
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Application
        env:
          VITE_API_URL: "https://meeting-summarizer-40l8.onrender.com"
        run: npm run build
